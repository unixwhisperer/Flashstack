name: FlashStack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-contracts:
    name: Test Smart Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Clarinet
        run: |
          curl -L https://github.com/stx-labs/clarinet/releases/download/v3.23.2/clarinet-linux-x64-glibc.tar.gz -o clarinet.tar.gz
          tar -xzf clarinet.tar.gz
          chmod +x ./clarinet
          sudo mv ./clarinet /usr/local/bin/
          clarinet --version

      - name: Run clarinet check
        run: npm run check

      - name: Run contract tests
        run: npm test

  build-web:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Build Next.js app
        run: cd web && npm run build
